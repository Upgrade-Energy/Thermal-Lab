name: Windows installers
on:
  push:
    branches: [main, development/installers-updates]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y nsis msitools
      - name: Install Thermal Lab test dependencies when needed
        shell: bash
        run: |
          if test -f pyproject.toml; then python -m pip install '.[desktop]'; fi
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Build pinned Windows installer
        run: python scripts/build_installer.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*-Setup-*.exe
            dist/*-Setup-*.exe.sha256
          if-no-files-found: error
  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - run: python -m pip install Pillow
      - name: Install, launch, busy-update and preservation checks
        run: python scripts/verify_windows_install.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: windows-evidence
  release:
    needs: [build, windows]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development/installers-updates')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Publish a new version after Windows verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('release.json'))['version'])")
          name=$(python -c "import json; print(json.load(open('release.json'))['name'])")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists. Increment release.json for another update. Existing assets are never overwritten."
            exit 0
          fi
          flags=()
          if [[ "$version" == *dev* || "$version" == *rc* || "$version" == *beta* || "$version" == *alpha* ]]; then flags+=(--prerelease); fi
          gh release create "v$version" dist/*-Setup-*.exe dist/*-Setup-*.exe.sha256 --target "$GITHUB_SHA" --title "$name $version" --notes-file docs/Installer-Release-Notes.md "${flags[@]}"
      - name: Verify real GitHub update discovery and download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_release_download.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: release-evidence
          if-no-files-found: error
